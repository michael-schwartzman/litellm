name: poc-verify-copilot-app-auth
on:
  push:
    branches: [poc_verify_copilot_app_auth]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_COPILOT_TOKEN_DIR: ${{ github.workspace }}/.copilot-tokens
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --inexact --frozen --extra proxy --group proxy-dev
      - name: unit tests (github_copilot)
        run: uv run pytest tests/unit/llms/github_copilot -q -p no:cacheprovider 2>&1 | tail -25
      - name: basedpyright on changed files
        continue-on-error: true
        run: uv run --no-sync basedpyright litellm/llms/github_copilot/app_installation_auth.py litellm/llms/github_copilot/authenticator.py litellm/llms/github_copilot/common_utils.py 2>&1 | grep -E "error|warning" | head -60
      - name: lint gates
        run: set -o pipefail; BASE_REF=79e63d3e06 make lint 2>&1 | grep -E "OK:|FAIL|BREACH|passed|Would reformat|Error|errors" 
      - name: e2e before (upstream main)
        env:
          GITHUB_COPILOT_APP_ID: "5626339"
          GITHUB_COPILOT_APP_INSTALLATION_ID: "178889411"
          GITHUB_COPILOT_APP_PRIVATE_KEY: ${{ secrets.COPILOT_APP_PRIVATE_KEY }}
        run: |
          git checkout 79e63d3e06 -- litellm/
          git rm -q --cached litellm/llms/github_copilot/app_installation_auth.py 2>/dev/null; rm -f litellm/llms/github_copilot/app_installation_auth.py
          ./poc/e2e.sh before || true
          git checkout HEAD -- litellm/
      - name: e2e after (this branch)
        env:
          GITHUB_COPILOT_APP_ID: "5626339"
          GITHUB_COPILOT_APP_INSTALLATION_ID: "178889411"
          GITHUB_COPILOT_APP_PRIVATE_KEY: ${{ secrets.COPILOT_APP_PRIVATE_KEY }}
        run: ./poc/e2e.sh after
